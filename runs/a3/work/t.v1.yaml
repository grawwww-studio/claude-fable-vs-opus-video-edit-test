version: 1
piece: "speedups-vs-face-short"
route: client
format: {size: [1080, 1920], fps: 24}
source: {video: ../material/takes/take06.mp4, words: words/take06.json}
glossary: [Mae, MiniMax H3, RTX 4090]
keep:
  - {id: hook,   src: ../material/takes/take06.mp4, words: words/take06.json, from: 0.0, to: 4.4, role: cold-open}
  - {id: intro,  src: ../material/takes/take01.mp4, words: words/take01.json, from: 0.0, to: 6.6}
  - {id: topic,  src: ../material/takes/take02.mp4, words: words/take02.json, from: 0.0, to: 6.5}
  - {id: her,    src: ../material/takes/take03.mp4, words: words/take03.json, from: 0.0, to: 5.6}
  - {id: setup,  src: ../material/takes/take04.mp4, words: words/take04.json, from: 0.0, to: 3.25}
  - {id: score,  src: ../material/takes/take07.mp4, words: words/take07.json, from: 0.0, to: 5.4}
  - {id: each,   src: ../material/takes/take05.mp4, words: words/take05.json, from: 0.0, to: 6.9}
  - {id: notm,   src: ../material/takes/take10.mp4, words: words/take10.json, from: 0.0, to: 5.7}
  - {id: point,  src: ../material/takes/take09.mp4, words: words/take09.json, from: 0.0, to: 4.9}
look:
  font: ../brand/anybody-latin-wdth-normal.woff2
  weight: 900
  case: upper
  ink: "#111111"
  plate: "#FBFBFA"
  accent: "#FFD400"
  band_ink: "#111111"
  fill: "#FBFBFA"
  outline: "#111111"
  outline_w: 0.10
  contrast: auto
  card: {ground: "#0E0E0E", ink: "#F4F4F1", accent: "#FFD400", muted: "#8E8E8A"}
captions: {size: 36, position: 0.74}
limits: {clip_trim_s: 3.6}
effects:
  - {keep: hook, at: "Fewer steps", do: broll, clip: ../material/results/result02.mp4, dur: 2.6,
     prompt: "Close shot of the test character, video model with a 4-step speed LoRA, 147 seconds a clip",
     model: "MiniMax H3 + 4-step speed LoRA"}
  - {keep: hook, at: "not that simple", do: slam, text: "NOT SIMPLE", cap: 62, dur: 1.2}
  - {keep: intro, at: "I'm Mae", do: panel, name: "MAE", label: "AI VIDEO ON ONE RTX 4090", dur: 3.4}
  - {keep: topic, at: "her face", do: slam, text: "HER FACE", cap: 84, dur: 1.0}
  - {keep: her, at: "You might know her", do: broll, clip: ../material/results/result01.mp4, dur: 5.0,
     prompt: "Close shot of the test character, base video model, 20 steps, no speed-up, 600 seconds a clip",
     model: "MiniMax H3 base, 20 steps"}
  - {keep: point, at: "check the face", do: slam, text: "CHECK THE FACE", cap: 52, dur: 1.6}
